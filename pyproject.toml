[project]
name = "scene-ripper"
version = "0.4.10"
description = "Video scene detection and analysis tool"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.scripts]
scene_ripper = "cli.main:main"
scene-ripper-mcp = "scene_ripper_mcp.server:main"

# Dependency contracts (kept aligned with requirements-*.txt by
# tests/test_dependency_contracts.py):
#   engine  - Qt-free engine, CLI and headless project work (requirements-engine.txt)
#   desktop - engine + PySide6/mpv GUI (requirements-core.txt, the frozen desktop contract)
#   mcp     - engine + the MCP server runtime
#   ml      - optional native ML runtimes installed on demand (requirements-optional.txt)
[project.optional-dependencies]
engine = [
    "certifi>=2024.0.0",
    "click>=8.0",
    "scenedetect[opencv]>=0.6.4",
    "opencv-python>=4.8",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "Pillow>=10.0",
    "rapidfuzz>=3.0.0",
    "google-api-python-client>=2.100.0",
    "keyring>=24.0",
    "litellm>=1.82.6",
    "tenacity>=8.2.0",
    "httpx>=0.25.0",
]
desktop = [
    "scene-ripper[engine]",
    "PySide6>=6.6",
    "python-mpv>=1.0.8",
]
mcp = [
    "scene-ripper[engine]",
    "mcp[cli]>=1.2.0",
]
ml = [
    "yt-dlp>=2024.1",
    "torch>=2.4,<2.7",
    "transformers>=4.50,<5",
    "torchvision>=0.19,<0.22",
    "einops>=0.7.0,<1.0",
    "sentencepiece>=0.2.0,<1.0",
    "protobuf>=4.25,<6",
    "mlx-vlm>=0.1.0,<1.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "lightning-whisper-mlx>=0.0.10,<1.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "faster-whisper>=1.0.0,<2",
    "ultralytics>=8.4.0,<9",
    "paddleocr>=3.0.0,<4",
    "librosa>=0.10.0,<1.0",
    "demucs-infer>=4.1.0,<5",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cli*", "core*", "models*", "ui*", "scene_ripper_mcp*"]

[tool.ruff]
exclude = [
    "build",
    "vendor",
    "prototypes",
    "replicate",
    "todos",
    "test_clips",
    "recording-issue-capture",
    "scripts",
    "packaging",
    "docs",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "strict"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "tests/",
    "docs/",
    "build/",
]

[[tool.mypy.overrides]]
module = "cli.*"
disallow_untyped_defs = false  # Start permissive, enable gradually
strict_optional = true
