version: 1

script:
  # Install Python dependencies into AppDir
  - pip install --target="${APPDIR}/usr/lib/python3/site-packages" -r requirements-core.txt

AppDir:
  path: ./AppDir

  app_info:
    id: com.algorithmic-filmmaking.scene-ripper
    name: Scene Ripper
    icon: scene-ripper
    version: !ENV ${VERSION:-0.1.0}
    # Must match the interpreter the wheels in usr/lib/python3/site-packages
    # were built for (the build host's python, 3.11) and the project's
    # requires-python >=3.11. jammy's bare "python3" is 3.10.
    exec: usr/bin/python3.11
    exec_args: "$APPDIR/usr/src/main.py $@"

  apt:
    arch: amd64
    sources:
      - sourceline: deb http://archive.ubuntu.com/ubuntu jammy main universe
        key_url: 'https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x871920D1991BC93C'
      - sourceline: deb http://archive.ubuntu.com/ubuntu jammy-updates main universe
        key_url: 'https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x871920D1991BC93C'

    include:
      # Python runtime. 3.11 explicitly: the project requires >=3.11 and the
      # bundled wheels are cp311, while jammy's "python3" is 3.10.
      - python3.11
      - python3.11-dev
      - python3.11-venv
      - python3-pip

      # OpenGL/EGL for Qt
      - libgl1
      - libegl1
      - libxcb-xinerama0

      # Video playback (MPV + FFmpeg, replaces GStreamer/Qt Multimedia)
      - libmpv-dev

      # Qt platform plugins
      - libxkbcommon0

  files:
    include:
      - usr/src/

    exclude:
      - usr/share/doc
      - usr/share/man
      - usr/share/info

  runtime:
    env:
      PYTHONPATH: "${APPDIR}/usr/lib/python3/site-packages"
      QT_PLUGIN_PATH: "${APPDIR}/usr/lib/x86_64-linux-gnu/qt6/plugins"

  test:
    fedora-30:
      image: fedora:30
      command: ./AppRun --help
    ubuntu-22.04:
      image: ubuntu:22.04
      command: ./AppRun --help

AppImage:
  arch: x86_64
  update-information: guess
  sign-key: None
